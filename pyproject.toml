[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelf-vlm"
version = "0.1.0"
description = "Shelf photo in, product counts, gaps, share of shelf and planogram compliance out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yogesh Awate" }]
# the core (schema, rows, compliance, metrics, data loading) is plain python on purpose:
# it runs and is tested without a GPU or any ML framework
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# filled in as milestones land (docs/ROADMAP.md)
train = [
    "torch>=2.4",
    "transformers>=4.50",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "pillow>=10",
]
app = ["gradio>=5", "pillow>=10"]
tracking = ["mlflow>=3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

[project.scripts]
shelf = "shelf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "train"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"scripts/svgdiagram.py" = ["E501"]  # long SVG attribute strings read better unbroken
"scripts/site_assets.py" = ["E402", "E501"]  # sys.path setup before imports; diagram coordinates

[tool.ruff.lint.isort]
known-first-party = ["shelf", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
